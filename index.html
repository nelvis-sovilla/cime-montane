<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>HUD Horizon Test - Step 1</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: monospace, system-ui; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000; color: #00E676; }
        
        #camera-feed { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
        #ar-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; }

        /* HUD Diagnostica */
        .hud-overlay { position: absolute; top: 12px; left: 12px; right: 12px; background: rgba(0, 0, 0, 0.75); border: 1px solid #00E676; padding: 10px; border-radius: 8px; font-size: 11px; z-index: 5; line-height: 1.4; }
        .hud-title { font-weight: bold; font-size: 13px; text-transform: uppercase; margin-bottom: 4px; border-bottom: 1px solid #00E676; padding-bottom: 2px; }

        /* Controlli di Test */
        .controls-bar { position: absolute; bottom: 20px; left: 0; right: 0; display: flex; justify-content: center; gap: 8px; z-index: 5; padding: 0 12px; }
        .btn { min-height: 48px; min-width: 48px; background: #00E676; color: #000; border: none; padding: 10px 18px; font-weight: bold; font-size: 14px; border-radius: 24px; cursor: pointer; text-transform: uppercase; }
        .btn:active { opacity: 0.8; }
        .btn-secondary { background: rgba(20, 20, 20, 0.85); color: #00E676; border: 1px solid #00E676; }
    </style>
</head>
<body>

    <video id="camera-feed" autoplay playsinline muted></video>
    <canvas id="ar-canvas"></canvas>

    <!-- Telemetria Sensori in Tempo Reale -->
    <div class="hud-overlay">
        <div class="hud-title">TEST HUD STEP 1 - TELEMETRIA</div>
        <div>AZIMUTH (Alpha) : <span id="val-a">0</span>°</div>
        <div>PITCH (Beta)     : <span id="val-b">0</span>°</div>
        <div>ROLL (Gamma)    : <span id="val-g">0</span>°</div>
        <div>ORIENTAMENTO    : <span id="val-orient">Portrait</span> (<span id="val-angle">0</span>°)</div>
        <div>RISOLUZIONE HUD : <span id="val-res">0x0</span></div>
    </div>

    <div class="controls-bar">
        <button class="btn btn-secondary" onclick="toggleInvertPitch()">Inverti Pitch</button>
        <button class="btn btn-secondary" onclick="toggleInvertRoll()">Inverti Roll</button>
        <button class="btn" onclick="resetCalibration()">Zero Nord</button>
    </div>

    <script>
        let rawAlpha = 0, rawBeta = 0, rawGamma = 0;
        let filtAlpha = 0, filtBeta = 0, filtGamma = 0;
        let calibratedHeadingOffset = 0;
        let invertPitch = false;
        let invertRoll = false;

        window.addEventListener('DOMContentLoaded', () => {
            initCamera();
            initSensors();
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
            startARLoop();
        });

        // Avvio Fotocamera
        async function initCamera() {
            const video = document.getElementById('camera-feed');
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false });
                video.srcObject = stream;
            } catch (e) {
                try {
                    const streamFallback = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                    video.srcObject = streamFallback;
                } catch (err) {
                    console.warn("Fotocamera non disponibile");
                }
            }
        }

        // Ascolto Sensori Movimento
        function initSensors() {
            window.addEventListener('deviceorientation', (e) => {
                rawAlpha = e.alpha || 0;
                rawBeta = e.beta || 0;
                rawGamma = e.gamma || 0;

                // Filtro passa-basso (Low-Pass Filter) per azzerare i tremolii del giroscopio
                let diffA = rawAlpha - filtAlpha;
                if (diffA > 180) diffA -= 360;
                if (diffA < -180) diffA += 360;
                filtAlpha = (filtAlpha + diffA * 0.15 + 360) % 360;

                filtBeta += (rawBeta - filtBeta) * 0.15;
                filtGamma += (rawGamma - filtGamma) * 0.15;

                updateHUDTelemetry();
            });
        }

        function getScreenAngle() {
            return (screen.orientation && typeof screen.orientation.angle === 'number') 
                ? screen.orientation.angle 
                : (window.orientation || 0);
        }

        function updateHUDTelemetry() {
            document.getElementById('val-a').innerText = Math.round(filtAlpha);
            document.getElementById('val-b').innerText = Math.round(filtBeta);
            document.getElementById('val-g').innerText = Math.round(filtGamma);
            
            const screenAngle = getScreenAngle();
            const isLandscape = window.innerWidth > window.innerHeight;
            document.getElementById('val-orient').innerText = isLandscape ? "Landscape" : "Portrait";
            document.getElementById('val-angle').innerText = screenAngle;
        }

        function resizeCanvas() {
            const canvas = document.getElementById('ar-canvas');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            document.getElementById('val-res').innerText = `${canvas.width}x${canvas.height}`;
        }

        function toggleInvertPitch() { invertPitch = !invertPitch; }
        function toggleInvertRoll() { invertRoll = !invertRoll; }
        function resetCalibration() { calibratedHeadingOffset = filtAlpha; }

        // Ciclo di Render Grafico a 60 FPS
        function startARLoop() {
            function loop() {
                renderHUD();
                requestAnimationFrame(loop);
            }
            loop();
        }

        function renderHUD() {
            const canvas = document.getElementById('ar-canvas');
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const w = canvas.width;
            const h = canvas.height;
            const cx = w / 2;
            const cy = h / 2;
            const isLandscape = w > h;

            // 1. Calcolo Inclinazione e Rollio in base all'orientamento dello schermo
            let pitch = 0;
            let roll = 0;

            if (!isLandscape) {
                // Portrait: beta = inclinazione verticale, gamma = rollio laterale
                pitch = filtBeta - 90;
                roll = filtGamma;
            } else {
                // Landscape: gamma gestisce la pendenza verticale, beta il rollio
                const scrAngle = getScreenAngle();
                if (scrAngle === 90) {
                    pitch = -filtGamma;
                    roll = filtBeta;
                } else if (scrAngle === 270 || scrAngle === -90) {
                    pitch = filtGamma;
                    roll = -filtBeta;
                } else {
                    pitch = (filtGamma > 0) ? -filtBeta : filtBeta;
                    roll = filtGamma;
                }
            }

            if (invertPitch) pitch = -pitch;
            if (invertRoll) roll = -roll;

            const pxPerDegree = isLandscape ? h / 50 : h / 60; // Scala gradi/pixel

            // -------------------------------------------------------------
            // 2. DISGNO ORIZZONTE ARTIFICIALE (Linea che ruota e trasla)
            // -------------------------------------------------------------
            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate((roll * Math.PI) / 180); // Ruota la vista in base al rollio

            const horizonY = pitch * pxPerDegree; // Sposta verticalmente in base al pitch

            // Linea Orizzonte Principale
            ctx.strokeStyle = "#00E676";
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(-w, horizonY);
            ctx.lineTo(w, horizonY);
            ctx.stroke();

            // Mirino Centrale Fisso dello Schermo
            ctx.strokeStyle = "#FFF";
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.arc(0, 0, 10, 0, Math.PI * 2);
            ctx.moveTo(-20, 0); ctx.lineTo(-10, 0);
            ctx.moveTo(10, 0); ctx.lineTo(20, 0);
            ctx.moveTo(0, -20); ctx.lineTo(0, -10);
            ctx.moveTo(0, 10); ctx.lineTo(0, 20);
            ctx.stroke();

            // Tacche di Pitch (+10°, +20°, -10°, -20°)
            for (let deg = -40; deg <= 40; deg += 10) {
                if (deg === 0) continue;
                let y = horizonY - (deg * pxPerDegree);
                let lineW = (deg % 20 === 0) ? 60 : 30;
                
                ctx.strokeStyle = "rgba(0, 230, 118, 0.6)";
                ctx.beginPath();
                ctx.moveTo(-lineW / 2, y);
                ctx.lineTo(lineW / 2, y);
                ctx.stroke();

                ctx.fillStyle = "rgba(0, 230, 118, 0.8)";
                ctx.font = "10px monospace";
                ctx.fillText(`${deg}°`, lineW / 2 + 5, y + 3);
            }
            ctx.restore();

            // -------------------------------------------------------------
            // 3. DISEGNO PASSA-BUSSOLA PUNTI CARDINALI (Assi Nord, Est, Sud, Ovest)
            // -------------------------------------------------------------
            const currentHeading = (filtAlpha - calibratedNorthOffset + 360) % 360;
            const cardinalPoints = [
                { name: "NORD (0°)",   deg: 0 },
                { name: "EST (90°)",   deg: 90 },
                { name: "SUD (180°)",  deg: 180 },
                { name: "OVEST (270°)", deg: 270 }
            ];

            const fovH = isLandscape ? 70 : 50;

            cardinalPoints.forEach(pt => {
                let diffH = pt.deg - currentHeading;
                if (diffH > 180) diffH -= 360;
                if (diffH < -180) diffH += 360;

                // Se il punto cardinale rientra nell'inquadratura
                if (Math.abs(diffH) < fovH / 2) {
                    let posX = cx + (diffH * (w / fovH));

                    // Asse verticale del punto cardinale
                    ctx.strokeStyle = "rgba(0, 230, 118, 0.8)";
                    ctx.setLineDash([6, 6]);
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.moveTo(posX, 80);
                    ctx.lineTo(posX, h - 80);
                    ctx.stroke();
                    ctx.setLineDash([]);

                    // Etichetta del Punto Cardinale
                    ctx.fillStyle = "#000";
                    ctx.fillRect(posX - 45, 85, 90, 22);
                    ctx.strokeStyle = "#00E676";
                    ctx.strokeRect(posX - 45, 85, 90, 22);

                    ctx.fillStyle = "#00E676";
                    ctx.font = "bold 11px monospace";
                    ctx.textAlign = "center";
                    ctx.fillText(pt.name, posX, 100);
                }
            });
        }
    </script>
</body>
</html>
