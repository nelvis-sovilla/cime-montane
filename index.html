<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>PeakFinder AR - MVP v3.15 (Verde Bypass)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000; color: #fff; }
        
        #camera-feed { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
        #ar-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; }

        .screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; z-index: 10; background: rgba(0,0,0,0.85); }
        .hidden { display: none !important; }

        .calibration-box { background: rgba(20,20,20,0.95); padding: 15px; border-radius: 16px; text-align: center; margin: auto 0; border: 1px solid #333; }
        .compass-dial { width: 140px; height: 140px; border: 4px solid #00E676; border-radius: 50%; margin: 10px auto; position: relative; display: flex; align-items: center; justify-content: center; }
        .arrow { width: 6px; height: 60px; background: #00E676; position: absolute; transform-origin: bottom center; top: 10px; border-radius: 4px; }
        .arrow::before { content: ''; position: absolute; top: -10px; left: -7px; border-left: 10px solid transparent; border-right: 10px solid transparent; border-bottom: 15px solid #00E676; }

        .btn { min-height: 48px; min-width: 48px; background: #00E676; color: #000; border: none; padding: 12px 24px; font-weight: bold; font-size: 16px; border-radius: 24px; cursor: pointer; margin: 5px; }
        .btn:active { opacity: 0.8; }
        .btn-secondary { background: #333; color: #fff; }
        input[type=range] { width: 100%; height: 48px; accent-color: #00E676; }

        .diag-box { background: rgba(0,230,118,0.1); border: 1px solid #00E676; padding: 8px; border-radius: 8px; font-size: 11px; text-align: left; margin-bottom: 10px; }
        .status-bar { position: absolute; top: 15px; left: 15px; right: 15px; background: rgba(0,0,0,0.85); padding: 10px; border-radius: 8px; font-size: 12px; z-index: 5; pointer-events: none; border: 1px solid #00E676; }
        .controls-bar { position: absolute; bottom: 20px; left: 0; right: 0; display: flex; justify-content: center; z-index: 5; gap: 10px; }
    </style>
</head>
<body>

    <video id="camera-feed" autoplay playsinline muted></video>
    <canvas id="ar-canvas"></canvas>

    <div id="status-bar" class="status-bar hidden">
        GPS: <span id="gps-status">In attesa...</span> | Fonte: <span id="api-status">Inizializzazione...</span> | Cime: <span id="peaks-count">0</span>
    </div>

    <!-- Calibrazione Nord -->
    <div id="calib-screen" class="screen">
        <div style="text-align: center; margin-top: 10px;">
            <h2>Calibrazione Nord (v3.15 Verde)</h2>
            <p style="font-size: 13px; color: #ccc; margin-top: 5px;">Orienta la freccia verso il Nord e premi il pulsante.</p>
        </div>

        <div class="calibration-box">
            <div class="diag-box">
                <b>Diagnostica Hardware:</b><br>
                • Giroscopio: <span id="diag-gyro">In attesa dati...</span><br>
                • GPS: <span id="diag-gps">In attesa dati...</span><br>
                • Fotocamera: <span id="diag-cam">Pronta</span>
            </div>

            <div class="compass-dial">
                <div id="arrow" class="arrow" style="transform: rotate(0deg);"></div>
            </div>
            <div style="margin: 10px 0;">
                <input type="range" id="angle-slider" min="0" max="359" value="0">
            </div>
            <p>Offset Nord: <b id="angle-val">0°</b></p>
        </div>

        <button id="calib-btn" class="btn" onclick="confirmCalibration()">Conferma e Avvia App</button>
    </div>

    <div id="ar-controls" class="controls-bar hidden">
        <button class="btn btn-secondary" onclick="recalibrate()">Ricalibra Nord</button>
        <button class="btn" id="freeze-btn" onclick="toggleFreeze()">Blocca Vista</button>
    </div>

    <script>
        let userLat = null, userLon = null, userAlt = 0;
        let calibratedNorthOffset = 0;
        let deviceAlpha = 0, deviceBeta = 0, deviceGamma = 0;
        let visiblePeaks = [];
        let isFrozen = false;
        let videoStream = null;
        let animFrameId = null;

        const offlineBackupPeaks = [
            { name: "Monte Cimone", lat: 44.1938, lon: 10.6997, ele: 2165 },
            { name: "Corno alle Scale", lat: 44.1228, lon: 10.8317, ele: 1945 },
            { name: "Monte Cusna", lat: 44.2883, lon: 10.4014, ele: 2121 },
            { name: "Monte Venere", lat: 44.2251, lon: 11.2721, ele: 965 },
            { name: "Monte Adone", lat: 44.3314, lon: 11.3103, ele: 654 },
            { name: "Monte della Formica", lat: 44.3381, lon: 11.3812, ele: 538 },
            { name: "Monte Vigese", lat: 44.2381, lon: 11.1091, ele: 1091 },
            { name: "Colle di San Luca", lat: 44.4792, lon: 11.3142, ele: 300 }
        ];

        const slider = document.getElementById('angle-slider');
        const arrow = document.getElementById('arrow');
        const angleVal = document.getElementById('angle-val');

        slider.addEventListener('input', (e) => {
            const val = e.target.value;
            arrow.style.transform = `rotate(${val}deg)`;
            angleVal.innerText = `${val}°`;
        });

        window.addEventListener('DOMContentLoaded', () => {
            initGPS();
            initSensors();
            window.addEventListener('resize', resizeCanvas);
            window.addEventListener('orientationchange', () => setTimeout(resizeCanvas, 200));
        });

        function getScreenAngle() {
            if (screen && screen.orientation && typeof screen.orientation.angle === 'number') {
                return screen.orientation.angle;
            }
            if (typeof window.orientation === 'number') {
                return window.orientation;
            }
            return 0;
        }

        function initGPS() {
            if ("geolocation" in navigator) {
                navigator.geolocation.watchPosition(
                    pos => {
                        userLat = pos.coords.latitude;
                        userLon = pos.coords.longitude;
                        userAlt = pos.coords.altitude || 0;
                        document.getElementById('gps-status').innerText = `${userLat.toFixed(3)}, ${userLon.toFixed(3)}`;
                        document.getElementById('diag-gps').innerText = "OK (" + userLat.toFixed(2) + ")";
                        if (visiblePeaks.length === 0) fetchPeaksFastBBox(userLat, userLon);
                    },
                    err => { 
                        document.getElementById('gps-status').innerText = "Errore GPS"; 
                        document.getElementById('diag-gps').innerText = "Bloccato/Non disponibile";
                        userLat = 44.4949; userLon = 11.3426; userAlt = 54;
                        if (visiblePeaks.length === 0) processOfflinePeaks(userLat, userLon);
                    },
                    { enableHighAccuracy: true, timeout: 5000 }
                );
            }
        }

        function initSensors() {
            window.addEventListener('deviceorientation', (e) => {
                if (isFrozen) return;
                deviceAlpha = e.alpha || 0;
                deviceBeta = e.beta || 0;
                deviceGamma = e.gamma || 0;

                document.getElementById('diag-gyro').innerText = "OK (" + Math.round(deviceAlpha) + "°)";
            });
        }

        function getScreenVectors() {
            const degToRad = Math.PI / 180;
            const a = deviceAlpha * degToRad;
            const b = deviceBeta * degToRad;
            const g = deviceGamma * degToRad;

            const cA = Math.cos(a), sA = Math.sin(a);
            const cB = Math.cos(b), sB = Math.sin(b);
            const cG = Math.cos(g), sG = Math.sin(g);

            const bx_E = [ cA*cG - sA*sB*sG,  sA*cG + cA*sB*sG, -cB*sG ];
            const by_E = [ -sA*cB,             cA*cB,            sB     ];
            const bz_E = [  cA*sG + sA*sB*cG,  sA*sG - cA*sB*cG,  cB*cG  ];

            const F = [ -bz_E[0], -bz_E[1], -bz_E[2] ];

            const screenAngle = getScreenAngle();
            const isLandscape = window.innerWidth > window.innerHeight;

            let r_body, u_body;

            if (screenAngle === 90) {
                r_body = [0, -1, 0]; u_body = [1, 0, 0];
            } else if (screenAngle === 270 || screenAngle === -90) {
                r_body = [0, 1, 0]; u_body = [-1, 0, 0];
            } else if (screenAngle === 180) {
                r_body = [-1, 0, 0]; u_body = [0, -1, 0];
            } else {
                if (isLandscape) {
                    if (deviceGamma > 0) { r_body = [0, -1, 0]; u_body = [1, 0, 0]; }
                    else { r_body = [0, 1, 0]; u_body = [-1, 0, 0]; }
                } else {
                    r_body = [1, 0, 0]; u_body = [0, 1, 0];
                }
            }

            function multiplyR(v) {
                return [
                    v[0]*bx_E[0] + v[1]*by_E[0] + v[2]*bz_E[0],
                    v[0]*bx_E[1] + v[1]*by_E[1] + v[2]*bz_E[1],
                    v[0]*bx_E[2] + v[1]*by_E[2] + v[2]*bz_E[2]
                ];
            }

            return { F, R: multiplyR(r_body), U: multiplyR(u_body) };
        }

        function confirmCalibration() {
            try {
                const manualAngle = parseInt(slider.value) || 0;
                let camHeading = 0;
                try {
                    const screenVecs = getScreenVectors();
                    camHeading = (Math.atan2(screenVecs.F[0], screenVecs.F[1]) * 180 / Math.PI + 360) % 360;
                } catch(e) { camHeading = 0; }

                calibratedNorthOffset = (camHeading - manualAngle + 360) % 360;
            } catch(e) {
                console.error(e);
            }

            document.getElementById('calib-screen').classList.add('hidden');
            document.getElementById('status-bar').classList.remove('hidden');
            document.getElementById('ar-controls').classList.remove('hidden');

            startCamera();
            startARLoop();
        }

        function recalibrate() {
            if (animFrameId) cancelAnimationFrame(animFrameId);
            visiblePeaks.forEach(p => { p.smoothX = null; p.smoothY = null; });

            document.getElementById('calib-screen').classList.remove('hidden');
            document.getElementById('status-bar').classList.add('hidden');
            document.getElementById('ar-controls').classList.add('hidden');
        }

        function startCamera() {
            const video = document.getElementById('camera-feed');
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;

            navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false })
                .then(stream => {
                    videoStream = stream;
                    video.srcObject = stream;
                    video.play().catch(e => console.warn(e));
                    resizeCanvas();
                })
                .catch(err => {
                    navigator.mediaDevices.getUserMedia({ video: true, audio: false })
                        .then(stream => {
                            videoStream = stream;
                            video.srcObject = stream;
                            video.play().catch(e => console.warn(e));
                            resizeCanvas();
                        })
                        .catch(e => console.warn("Camera bloccata"));
                });
        }

        function resizeCanvas() {
            const canvas = document.getElementById('ar-canvas');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        async function fetchPeaksFastBBox(lat, lon) {
            const statusEl = document.getElementById('api-status');
            statusEl.innerText = "Ricerca online...";

            const minLat = (lat - 0.18).toFixed(4);
            const maxLat = (lat + 0.18).toFixed(4);
            const minLon = (lon - 0.25).toFixed(4);
            const maxLon = (lon + 0.25).toFixed(4);

            const query = `[out:json][timeout:5];node["natural"="peak"](${minLat},${minLon},${maxLat},${maxLon});out body;`;
            
            const servers = [
                "https://overpass-api.de/api/interpreter",
                "https://overpass.kumi.systems/api/interpreter"
            ];

            for (let server of servers) {
                try {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 4000);

                    const res = await fetch(`${server}?data=${encodeURIComponent(query)}`, { signal: controller.signal });
                    clearTimeout(timeoutId);

                    if (res.ok) {
                        const data = await res.json();
                        if (data && data.elements && data.elements.length > 0) {
                            statusEl.innerText = "Online (OpenStreetMap)";
                            processPeaksData(data.elements, lat, lon);
                            return;
                        }
                    }
                } catch (e) {
                    console.warn("Server occupato...");
                }
            }

            statusEl.innerText = "Offline (Dati locali)";
            processOfflinePeaks(lat, lon);
        }

        function processPeaksData(elements, lat, lon) {
            let raw = elements.map(el => {
                if (!el || !el.tags) return null;
                const name = el.tags.name || el.tags['name:it'] || el.tags.official_name;
                if (!name || !el.tags.ele) return null;

                const ele = parseFloat(el.tags.ele);
                if (isNaN(ele)) return null;

                const distKm = calculateDistance(lat, lon, el.lat, el.lon);
                const bearing = calculateBearing(lat, lon, el.lat, el.lon);
                
                const eleDiffMeters = ele - userAlt;
                const elevationAngle = Math.atan2(eleDiffMeters, distKm * 1000) * 180 / Math.PI;
                const prominenceScore = ele / Math.sqrt(distKm);

                return { name, ele, dist: distKm, bearing, elevationAngle, prominenceScore, smoothX: null, smoothY: null };
            }).filter(p => p !== null);

            finalizePeakList(raw);
        }

        function processOfflinePeaks(lat, lon) {
            let raw = offlineBackupPeaks.map(p => {
                const distKm = calculateDistance(lat, lon, p.lat, p.lon);
                const bearing = calculateBearing(lat, lon, p.lat, p.lon);
                const eleDiffMeters = p.ele - userAlt;
                const elevationAngle = Math.atan2(eleDiffMeters, distKm * 1000) * 180 / Math.PI;
                const prominenceScore = p.ele / Math.sqrt(distKm);

                return { name: p.name, ele: p.ele, dist: distKm, bearing, elevationAngle, prominenceScore, smoothX: null, smoothY: null };
            });

            finalizePeakList(raw);
        }

        function finalizePeakList(raw) {
            if (raw.length === 0) {
                document.getElementById('peaks-count').innerText = "0";
                return;
            }

            raw.sort((a, b) => b.prominenceScore - a.prominenceScore);
            let topPeaks = raw.slice(0, 12);

            topPeaks.sort((a, b) => a.dist - b.dist);
            topPeaks.forEach((p, idx) => { p.slot = idx % 3; });

            visiblePeaks = topPeaks;
            document.getElementById('peaks-count').innerText = visiblePeaks.length;
        }

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        function calculateBearing(lat1, lon1, lat2, lon2) {
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const y = Math.sin(dLon) * Math.cos(lat2 * Math.PI / 180);
            const x = Math.cos(lat1 * Math.PI / 180) * Math.sin(lat2 * Math.PI / 180) -
                      Math.sin(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.cos(dLon);
            return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
        }

        function startARLoop() {
            if (animFrameId) cancelAnimationFrame(animFrameId);
            function loop() {
                if (!isFrozen && document.getElementById('calib-screen').classList.contains('hidden')) {
                    renderAR();
                }
                animFrameId = requestAnimationFrame(loop);
            }
            loop();
        }

        function drawRoundRect(ctx, x, y, w, h, r) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.arcTo(x + w, y, x + w, y + h, r);
            ctx.arcTo(x + w, y + h, x, y + h, r);
            ctx.arcTo(x, y + h, x, y, r);
            ctx.arcTo(x, y, x + w, y, r);
            ctx.closePath();
        }

        function renderAR() {
            const canvas = document.getElementById('ar-canvas');
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const isLandscape = window.innerWidth > window.innerHeight;
            const screenVecs = getScreenVectors();
            const rad = Math.PI / 180;

            const fovHRad = (isLandscape ? 70 : 50) * rad;
            const fovVRad = (isLandscape ? 45 : 65) * rad;

            const tanH = Math.tan(fovHRad / 2);
            const tanV = Math.tan(fovVRad / 2);

            visiblePeaks.forEach(peak => {
                let adjBearing = (peak.bearing - calibratedNorthOffset + 360) % 360;
                let bRad = adjBearing * rad;
                let eRad = peak.elevationAngle * rad;

                let P_E = Math.sin(bRad) * Math.cos(eRad);
                let P_N = Math.cos(bRad) * Math.cos(eRad);
                let P_U = Math.sin(eRad);

                let x_p = P_E * screenVecs.R[0] + P_N * screenVecs.R[1] + P_U * screenVecs.R[2];
                let y_p = P_E * screenVecs.U[0] + P_N * screenVecs.U[1] + P_U * screenVecs.U[2];
                let z_p = P_E * screenVecs.F[0] + P_N * screenVecs.F[1] + P_U * screenVecs.F[2];

                if (z_p > 0.05) {
                    let targetX = (canvas.width / 2) + (x_p / z_p) * (canvas.width / (2 * tanH));
                    let targetY = (canvas.height / 2) - (y_p / z_p) * (canvas.height / (2 * tanV)) + ((peak.slot - 1) * 25);

                    if (targetX >= -100 && targetX <= canvas.width + 100 &&
                        targetY >= -100 && targetY <= canvas.height + 100) {

                        if (peak.smoothX === null) {
                            peak.smoothX = targetX;
                            peak.smoothY = targetY;
                        } else {
                            peak.smoothX += (targetX - peak.smoothX) * 0.25;
                            peak.smoothY += (targetY - peak.smoothY) * 0.25;
                        }

                        ctx.save();
                        ctx.translate(peak.smoo
