<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>HUD Horizon Test - Step 1.2 Stabilizzato</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: monospace, system-ui; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000; color: #00E676; }
        
        #camera-feed { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
        #ar-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; }

        .hud-overlay { position: absolute; top: 12px; left: 12px; right: 12px; background: rgba(0, 0, 0, 0.85); border: 1px solid #00E676; padding: 10px; border-radius: 8px; font-size: 11px; z-index: 5; line-height: 1.4; }
        .hud-title { font-weight: bold; font-size: 13px; text-transform: uppercase; margin-bottom: 4px; border-bottom: 1px solid #00E676; padding-bottom: 2px; }

        .controls-bar { position: absolute; bottom: 15px; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; gap: 8px; z-index: 5; padding: 0 12px; }
        .btn-group { display: flex; justify-content: center; gap: 6px; width: 100%; }
        .btn { min-height: 44px; background: #00E676; color: #000; border: none; padding: 8px 14px; font-weight: bold; font-size: 12px; border-radius: 20px; cursor: pointer; text-transform: uppercase; }
        .btn:active { opacity: 0.8; }
        .btn-secondary { background: rgba(20, 20, 20, 0.85); color: #00E676; border: 1px solid #00E676; }
        
        .slider-box { width: 100%; max-width: 320px; background: rgba(0,0,0,0.8); border: 1px solid #00E676; padding: 6px 12px; border-radius: 12px; text-align: center; font-size: 11px; }
        input[type=range] { width: 100%; accent-color: #00E676; }
    </style>
</head>
<body>

    <video id="camera-feed" autoplay playsinline muted></video>
    <canvas id="ar-canvas"></canvas>

    <div class="hud-overlay">
        <div class="hud-title">TEST HUD STEP 1.2 - STABILIZZATO</div>
        <div>AZIMUTH (Alpha) : <span id="val-a">0</span>°</div>
        <div>PITCH (Beta)     : <span id="val-b">0</span>°</div>
        <div>ROLL (Gamma)    : <span id="val-g">0</span>°</div>
        <div>SMORZAMENTO     : <span id="val-smooth">0.03</span></div>
    </div>

    <div class="controls-bar">
        <div class="slider-box">
            <span>Fluidità Movimento (Smorzamento):</span>
            <input type="range" id="smooth-slider" min="1" max="20" value="3">
        </div>
        <div class="btn-group">
            <button class="btn btn-secondary" onclick="toggleInvertPitch()">Inverti Pitch</button>
            <button class="btn btn-secondary" onclick="toggleInvertRoll()">Inverti Roll</button>
            <button class="btn" onclick="resetCalibration()">Zero Nord</button>
        </div>
    </div>

    <script>
        let rawAlpha = 0, rawBeta = 0, rawGamma = 0;
        let filtAlpha = 0, filtBeta = 0, filtGamma = 0;
        let calibratedHeadingOffset = 0;
        let invertPitch = false;
        let invertRoll = false;
        let smoothFactor = 0.03; // Smorzamento pesante iniziale per bloccare i tremolii

        window.addEventListener('DOMContentLoaded', () => {
            const slider = document.getElementById('smooth-slider');
            if (slider) {
                slider.addEventListener('input', () => {
                    smoothFactor = slider.value / 100; // Valori da 0.01 (molto lento) a 0.20 (veloce)
                    document.getElementById('val-smooth').innerText = smoothFactor.toFixed(2);
                });
            }

            initCamera();
            initSensors();
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
            startARLoop();
        });

        async function initCamera() {
            const video = document.getElementById('camera-feed');
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false });
                video.srcObject = stream;
            } catch (e) {
                try {
                    const streamFallback = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                    video.srcObject = streamFallback;
                } catch (err) {
                    console.warn("Fotocamera non disponibile");
                }
            }
        }

        function initSensors() {
            window.addEventListener('deviceorientation', (e) => {
                rawAlpha = e.alpha || 0;
                rawBeta = e.beta || 0;
                rawGamma = e.gamma || 0;

                // Applicazione filtro passa-basso graduale
                let diffA = rawAlpha - filtAlpha;
                if (diffA > 180) diffA -= 360;
                if (diffA < -180) diffA += 360;
                filtAlpha = (filtAlpha + diffA * smoothFactor + 360) % 360;

                filtBeta += (rawBeta - filtBeta) * smoothFactor;
                filtGamma += (rawGamma - filtGamma) * smoothFactor;

                document.getElementById('val-a').innerText = Math.round(filtAlpha);
                document.getElementById('val-b').innerText = Math.round(filtBeta);
                document.getElementById('val-g').innerText = Math.round(filtGamma);
            });
        }

        function resizeCanvas() {
            const canvas = document.getElementById('ar-canvas');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        function toggleInvertPitch() { invertPitch = !invertPitch; }
        function toggleInvertRoll() { invertRoll = !invertRoll; }
        function resetCalibration() { calibratedHeadingOffset = filtAlpha; }

        function startARLoop() {
            function loop() {
                renderHUD();
                requestAnimationFrame(loop);
            }
            loop();
        }

        function renderHUD() {
            const canvas = document.getElementById('ar-canvas');
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const w = canvas.width;
            const h = canvas.height;
            const cx = w / 2;
            const cy = h / 2;
            const isLandscape = w > h;

            let pitch = 0;
            let roll = 0;

            if (!isLandscape) {
                pitch = filtBeta - 90;
                // Anti-Gimbal Lock: smorza l'inclinazione laterale se il telefono è quasi verticale
                const verticalFactor = Math.cos((pitch * Math.PI) / 180);
                roll = filtGamma * Math.abs(verticalFactor);
            } else {
                pitch = (filtGamma > 0) ? -filtBeta : filtBeta;
                roll = filtGamma * 0.5;
            }

            if (invertPitch) pitch = -pitch;
            if (invertRoll) roll = -roll;

            // Riduzione della scala per evitare che l'orizzonte schizzi fuori dallo schermo
            const pxPerDegree = isLandscape ? h / 90 : h / 100;
            const horizonY = pitch * pxPerDegree;

            // 1. Mirino centrale fisso (Rosso)
            ctx.strokeStyle = "#FF0055";
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(cx, cy, 12, 0, Math.PI * 2);
            ctx.moveTo(cx - 20, cy); ctx.lineTo(cx + 20, cy);
            ctx.moveTo(cx, cy - 20); ctx.lineTo(cx, cy + 20);
            ctx.stroke();

            // 2. Griglia Orizzonte Artificiale
            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate((roll * Math.PI) / 180);

            ctx.strokeStyle = "#00E676";
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(-w / 2, horizonY);
            ctx.lineTo(w / 2, horizonY);
            ctx.stroke();

            for (let deg = -30; deg <= 30; deg += 10) {
                if (deg === 0) continue;
                let y = horizonY - (deg * pxPerDegree);
                
                ctx.strokeStyle = "rgba(0, 230, 118, 0.7)";
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(-25, y);
                ctx.lineTo(25, y);
                ctx.stroke();

                ctx.fillStyle = "#00E676";
                ctx.font = "bold 11px monospace";
                ctx.fillText(`${deg}°`, 30, y + 4);
            }
            ctx.restore();

            // 3. Linee dei Punti Cardinali
            const currentHeading = (filtAlpha - calibratedHeadingOffset + 360) % 360;
            const cardinalPoints = [
                { name: "NORD (0°)",   deg: 0 },
                { name: "EST (90°)",   deg: 90 },
                { name: "SUD (180°)",  deg: 180 },
                { name: "OVEST (270°)", deg: 270 }
            ];

            const fovH = isLandscape ? 70 : 50;

            cardinalPoints.forEach(pt => {
                let diffH = pt.deg - currentHeading;
                if (diffH > 180) diffH -= 360;
                if (diffH < -180) diffH += 360;

                if (Math.abs(diffH) < fovH / 2) {
                    let posX = cx + (diffH * (w / fovH));

                    ctx.strokeStyle = "rgba(0, 230, 118, 0.6)";
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(posX, 140);
                    ctx.lineTo(posX, h - 110);
                    ctx.stroke();

                    ctx.fillStyle = "#000";
                    ctx.fillRect(posX - 50, h - 100, 100, 22);
                    ctx.strokeStyle = "#00E676";
                    ctx.strokeRect(posX - 50, h - 100, 100, 22);

                    ctx.fillStyle = "#00E676";
                    ctx.font = "bold 11px monospace";
                    ctx.textAlign = "center";
                    ctx.fillText(pt.name, posX, h - 85);
                }
            });
        }
    </script>
</body>
</html>
