<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>PeakFinder AR - MVP v3.7</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000; color: #fff; }
        
        #camera-feed { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
        #ar-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; }

        .screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; z-index: 10; background: rgba(0,0,0,0.85); }
        .hidden { display: none !important; }

        .calibration-box { background: rgba(20,20,20,0.95); padding: 20px; border-radius: 16px; text-align: center; margin: auto 0; border: 1px solid #333; }
        .compass-dial { width: 160px; height: 160px; border: 4px solid #00E676; border-radius: 50%; margin: 15px auto; position: relative; display: flex; align-items: center; justify-content: center; }
        .arrow { width: 6px; height: 70px; background: #00E676; position: absolute; transform-origin: bottom center; top: 10px; border-radius: 4px; }
        .arrow::before { content: ''; position: absolute; top: -10px; left: -7px; border-left: 10px solid transparent; border-right: 10px solid transparent; border-bottom: 15px solid #00E676; }

        .btn { min-height: 48px; min-width: 48px; background: #00E676; color: #000; border: none; padding: 12px 24px; font-weight: bold; font-size: 16px; border-radius: 24px; cursor: pointer; margin: 5px; }
        .btn:active { opacity: 0.8; }
        .btn-secondary { background: #333; color: #fff; }
        input[type=range] { width: 100%; height: 48px; }

        .status-bar { position: absolute; top: 15px; left: 15px; right: 15px; background: rgba(0,0,0,0.85); padding: 10px; border-radius: 8px; font-size: 12px; z-index: 5; pointer-events: none; border: 1px solid #444; }
        .controls-bar { position: absolute; bottom: 20px; left: 0; right: 0; display: flex; justify-content: center; z-index: 5; gap: 10px; }
    </style>
</head>
<body>

    <video id="camera-feed" autoplay playsinline></video>
    <canvas id="ar-canvas"></canvas>

    <div id="status-bar" class="status-bar hidden">
        GPS: <span id="gps-status">In attesa...</span> | Fonte: <span id="api-status">Inizializzazione...</span> | Cime: <span id="peaks-count">0</span>
    </div>

    <!-- Calibrazione Nord -->
    <div id="calib-screen" class="screen">
        <div style="text-align: center; margin-top: 10px;">
            <h2>Calibrazione Nord</h2>
            <p style="font-size: 13px; color: #ccc; margin-top: 5px;">Orienta la freccia verso il Nord. Funziona sia in verticale che in orizzontale.</p>
        </div>

        <div class="calibration-box">
            <div class="compass-dial">
                <div id="arrow" class="arrow" style="transform: rotate(0deg);"></div>
            </div>
            <div style="margin: 10px 0;">
                <input type="range" id="angle-slider" min="0" max="359" value="0">
            </div>
            <p>Offset Nord: <b id="angle-val">0°</b></p>
            <p style="font-size: 11px; color: #aaa; margin-top: 4px;">Modalità Schermo: <span id="orient-val">Portrait</span></p>
        </div>

        <button class="btn" onclick="confirmCalibration()">Conferma e Avvia Fotocamera</button>
    </div>

    <div id="ar-controls" class="controls-bar hidden">
        <button class="btn btn-secondary" onclick="recalibrate()">Ricalibra Nord</button>
        <button class="btn" id="freeze-btn" onclick="toggleFreeze()">Blocca Vista</button>
    </div>

    <script>
        let userLat = null, userLon = null, userAlt = 0;
        let calibratedNorthOffset = 0;
        let deviceAlpha = 0, deviceBeta = 0, deviceGamma = 0;
        let visiblePeaks = [];
        let isFrozen = false;
        let videoStream = null;
        let animFrameId = null;

        const offlineBackupPeaks = [
            { name: "Monte Cimone", lat: 44.1938, lon: 10.6997, ele: 2165 },
            { name: "Corno alle Scale", lat: 44.1228, lon: 10.8317, ele: 1945 },
            { name: "Monte Cusna", lat: 44.2883, lon: 10.4014, ele: 2121 },
            { name: "Monte Venere", lat: 44.2251, lon: 11.2721, ele: 965 },
            { name: "Monte Adone", lat: 44.3314, lon: 11.3103, ele: 654 },
            { name: "Monte della Formica", lat: 44.3381, lon: 11.3812, ele: 538 },
            { name: "Monte Vigese", lat: 44.2381, lon: 11.1091, ele: 1091 },
            { name: "Colle di San Luca", lat: 44.4792, lon: 11.3142, ele: 300 }
        ];

        const slider = document.getElementById('angle-slider');
        const arrow = document.getElementById('arrow');
        const angleVal = document.getElementById('angle-val');

        slider.addEventListener('input', (e) => {
            const val = e.target.value;
            arrow.style.transform = `rotate(${val}deg)`;
            angleVal.innerText = `${val}°`;
        });

        window.addEventListener('DOMContentLoaded', () => {
            initGPS();
            initSensors();
            window.addEventListener('resize', resizeCanvas);
            window.addEventListener('orientationchange', () => setTimeout(resizeCanvas, 200));
        });

        function initGPS() {
            if ("geolocation" in navigator) {
                navigator.geolocation.watchPosition(
                    pos => {
                        userLat = pos.coords.latitude;
                        userLon = pos.coords.longitude;
                        userAlt = pos.coords.altitude || 0;
                        document.getElementById('gps-status').innerText = `${userLat.toFixed(3)}, ${userLon.toFixed(3)}`;
                        if (visiblePeaks.length === 0) fetchPeaksFastBBox(userLat, userLon);
                    },
                    err => { document.getElementById('gps-status').innerText = "Errore GPS"; },
                    { enableHighAccuracy: true }
                );
            }
        }

        function initSensors() {
            window.addEventListener('deviceorientation', (e) => {
                if (isFrozen) return;
                deviceAlpha = e.alpha || 0;
                deviceBeta = e.beta || 0;
                deviceGamma = e.gamma || 0;

                const isLandscape = window.innerWidth > window.innerHeight;
                document.getElementById('orient-val').innerText = isLandscape ? "Landscape" : "Portrait";
            });
        }

        function getCameraOrientation3D() {
            const degToRad = Math.PI / 180;
            const alpha = deviceAlpha * degToRad;
            const beta = deviceBeta * degToRad;
            const gamma = deviceGamma * degToRad;

            const cA = Math.cos(alpha), sA = Math.sin(alpha);
            const cB = Math.cos(beta),  sB = Math.sin(beta);
            const cG = Math.cos(gamma), sG = Math.sin(gamma);

            const x = -cA * sG - sA * sB * cG;
            const y = -sA * sG + cA * sB * cG;

            let azimuth = Math.atan2(x, y) * 180 / Math.PI;
            azimuth = (azimuth + 360) % 360;

            let pitch = 90 - deviceBeta;

            return { azimuth, pitch };
        }

        async function confirmCalibration() {
            try {
                const manualAngle = parseInt(slider.value);
                const cam = getCameraOrientation3D();
                calibratedNorthOffset = (cam.azimuth - manualAngle + 360) % 360;

                document.getElementById('calib-screen').classList.add('hidden');
                document.getElementById('status-bar').classList.remove('hidden');
                document.getElementById('ar-controls').classList.remove('hidden');

                await startCamera();
                startARLoop();
            } catch (err) {
                alert("Impossibile avviare la fotocamera: verificare i permessi.");
            }
        }

        function recalibrate() {
            if (animFrameId) cancelAnimationFrame(animFrameId);
            visiblePeaks.forEach(p => { p.smoothX = null; p.smoothY = null; });

            document.getElementById('calib-screen').classList.remove('hidden');
            document.getElementById('status-bar').classList.add('hidden');
            document.getElementById('ar-controls').classList.add('hidden');
        }

        async function startCamera() {
            try {
                videoStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { exact: "environment" } }, audio: false
                });
                document.getElementById('camera-feed').srcObject = videoStream;
            } catch (err) {
                videoStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                document.getElementById('camera-feed').srcObject = videoStream;
            }
            resizeCanvas();
        }

        function resizeCanvas() {
            const canvas = document.getElementById('ar-canvas');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        async function fetchPeaksFastBBox(lat, lon) {
            const statusEl = document.getElementById('api-status');
            statusEl.innerText = "Ricerca online...";

            const minLat = (lat - 0.18).toFixed(4);
            const maxLat = (lat + 0.18).toFixed(4);
            const minLon = (lon - 0.25).toFixed(4);
            const maxLon = (lon + 0.25).toFixed(4);

            const query = `[out:json][timeout:5];node["natural"="peak"](${minLat},${minLon},${maxLat},${maxLon});out body;`;
            
            const servers = [
                "https://overpass-api.de/api/interpreter",
                "https://overpass.kumi.systems/api/interpreter"
            ];

            for (let server of servers) {
                try {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 4000);

                    const res = await fetch(`${server}?data=${encodeURIComponent(query)}`, { signal: controller.signal });
                    clearTimeout(timeoutId);

                    if (res.ok) {
                        const data = await res.json();
                        if (data && data.elements && data.elements.length > 0) {
                            statusEl.innerText = "Online (OpenStreetMap)";
                            processPeaksData(data.elements, lat, lon);
                            return;
                        }
                    }
                } catch (e) {
                    console.warn("Server occupato, tento successivo...");
                }
            }

            statusEl.innerText = "Offline (Dati locali)";
            processOfflinePeaks(lat, lon);
        }

        function processPeaksData(elements, lat, lon) {
            let raw = elements.map(el => {
                if (!el || !el.tags) return null;
                const name = el.tags.name || el.tags['name:it'] || el.tags.official_name;
                if (!name || !el.tags.ele) return null;

                const ele = parseFloat(el.tags.ele);
                if (isNaN(ele)) return null;

                const distKm = calculateDistance(lat, lon, el.lat, el.lon);
                const bearing = calculateBearing(lat, lon, el.lat, el.lon);
                
                const eleDiffMeters = ele - userAlt;
                const elevationAngle = Math.atan2(eleDiffMeters, distKm * 1000) * 180 / Math.PI;
                const prominenceScore = ele / Math.sqrt(distKm);

                return { name, ele, dist: distKm, bearing, elevationAngle, prominenceScore, smoothX: null, smoothY: null };
            }).filter(p => p !== null);

            finalizePeakList(raw);
        }

        function processOfflinePeaks(lat, lon) {
            let raw = offlineBackupPeaks.map(p => {
                const distKm = calculateDistance(lat, lon, p.lat, p.lon);
                const bearing = calculateBearing(lat, lon, p.lat, p.lon);
                const eleDiffMeters = p.ele - userAlt;
                const elevationAngle = Math.atan2(eleDiffMeters, distKm * 1000) * 180 / Math.PI;
                const prominenceScore = p.ele / Math.sqrt(distKm);

                return { name: p.name, ele: p.ele, dist: distKm, bearing, elevationAngle, prominenceScore, smoothX: null, smoothY: null };
            });

            finalizePeakList(raw);
        }

        function finalizePeakList(raw) {
            if (raw.length === 0) {
                document.getElementById('peaks-count').innerText = "0";
                return;
            }

            raw.sort((a, b) => b.prominenceScore - a.prominenceScore);
            let topPeaks = raw.slice(0, 12);

            topPeaks.sort((a, b) => a.dist - b.dist);
            topPeaks.forEach((p, idx) => { p.slot = idx % 3; });

            visiblePeaks = topPeaks;
            document.getElementById('peaks-count').innerText = visiblePeaks.length;
        }

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        function calculateBearing(lat1, lon1, lat2, lon2) {
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const y = Math.sin(dLon) * Math.cos(lat2 * Math.PI / 180);
            const x = Math.cos(lat1 * Math.PI / 180) * Math.sin(lat2 * Math.PI / 180) -
                      Math.sin(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.cos(dLon);
            return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
        }

        function startARLoop() {
            if (animFrameId) cancelAnimationFrame(animFrameId);
            function loop() {
                if (!isFrozen && document.getElementById('calib-screen').classList.contains('hidden')) {
                    renderAR();
                }
                animFrameId = requestAnimationFrame(loop);
            }
            loop();
        }

        function renderAR() {
            const canvas = document.getElementById('ar-canvas');
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const isLandscape = window.innerWidth > window.innerHeight;
            const fovH = isLandscape ? 75 : 50;
            const fovV = isLandscape ? 45 : 65;

            const cam = getCameraOrientation3D();
            const currentHeading = (cam.azimuth - calibratedNorthOffset + 360) % 360;
            const currentPitch = cam.pitch;

            visiblePeaks.forEach(peak => {
                let diffBearing = peak.bearing - currentHeading;
                if (diffBearing > 180) diffBearing -= 360;
                if (diffBearing < -180) diffBearing += 360;

                let diffPitch = peak.elevationAngle - currentPitch;

                if (Math.abs(diffBearing) < fovH / 2 && Math.abs(diffPitch) < fovV / 2) {
                    let targetX = (canvas.width / 2) + (diffBearing * (canvas.width / fovH));
                    let targetY = (canvas.height / 2) + (diffPitch * (canvas.height / fovV)) + ((peak.slot - 1) * 25);

                    if (peak.smoothX === null) {
                        peak.smoothX = targetX;
                        peak.smoothY = targetY;
                    } else {
                        peak.smoothX += (targetX - peak.smoothX) * 0.25;
                        peak.smoothY += (targetY - peak.smoothY) * 0.25;
                    }

                    ctx.save();
                    ctx.translate(peak.smoothX, peak.smoothY);

                    ctx.fillStyle = "#00E676";
                    ctx.beginPath();
                    ctx.arc(0, 0, 5, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = "rgba(0,0,0,0.85)";
                    ctx.strokeStyle = "#00E676";
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.roundRect(-60, -38, 120, 32, 6);
                    ctx.fill();
                    ctx.stroke();

                    const safeDist = (typeof peak.dist === 'number' && !isNaN(peak.dist)) ? peak.dist.toFixed(1) : "0.0";

                    ctx.fillStyle = "#FFF";
                    ctx.font = "bold 11px system-ui";
                    ctx.textAlign = "center";
                    ctx.fillText(peak.name, 0, -22);
                    ctx.fillStyle = "#00E676";
                    ctx.font = "10px system-ui";
                    ctx.fillText(`${peak.ele}m | ${safeDist}km`, 0, -10);

                    ctx.restore();
                } else {
                    peak.smoothX = null;
                    peak.smoothY = null;
                }
            });
        }

        function toggleFreeze() {
            isFrozen = !isFrozen;
            const video = document.getElementById('camera-feed');
            const btn = document.getElementById('freeze-btn');
            if (isFrozen) {
                video.pause();
                btn.innerText = "Sblocca Vista";
            } else {
                video.play();
                btn.innerText = "Blocca Vista";
            }
        }
    </script>
</body>
</html>
