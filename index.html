<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>HUD AR - Calibrazione Tap Nord</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, monospace; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #0b0f19; color: #06b6d4; }
        
        #camera-feed { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
        #ar-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; }

        .hidden { display: none !important; }

        /* ==========================================================================
           FASE 1: SCHERMATA DEDICATA CALIBRAZIONE TAP
           ========================================================================== */
        .calib-container { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            display: flex; flex-direction: column; justify-content: space-between; 
            padding: 30px 20px; z-index: 20; background: #0b0f19; 
            cursor: pointer; text-align: center;
        }

        .calib-header { margin-top: 20px; }
        .calib-header h1 { color: #f8fafc; font-size: 22px; font-weight: 700; letter-spacing: 1px; }
        .calib-header p { color: #94a3b8; font-size: 14px; margin-top: 10px; line-height: 1.5; }

        .calib-body { 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            margin: auto 0; width: 100%; 
        }

        /* Freccia Fissa verso l'alto */
        .fixed-arrow-box {
            width: 180px; height: 180px; border: 3px dashed #06b6d4; border-radius: 50%;
            position: relative; display: flex; align-items: center; justify-content: center;
            background: #0f172a; box-shadow: 0 0 40px rgba(6, 182, 212, 0.15);
            margin-bottom: 20px;
        }

        .fixed-needle {
            width: 10px; height: 100px; background: #ef4444; position: absolute;
            top: 20px; border-radius: 5px;
        }
        .fixed-needle::before {
            content: ''; position: absolute; top: -14px; left: -10px;
            border-left: 15px solid transparent; border-right: 15px solid transparent;
            border-bottom: 22px solid #ef4444;
        }

        .tap-hint {
            font-size: 13px; color: #06b6d4; letter-spacing: 1px;
            font-weight: bold; text-transform: uppercase;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.4; }
            50% { opacity: 1; }
            100% { opacity: 0.4; }
        }

        /* ==========================================================================
           FASE 2: HUD VISTA AR (ATTIVI DOPO TAP)
           ========================================================================== */
        .hud-overlay { 
            position: absolute; top: 15px; left: 15px; 
            background: rgba(15, 23, 42, 0.85); border: 1px solid #06b6d4; 
            padding: 10px 14px; border-radius: 8px; font-size: 12px; z-index: 5; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); font-family: monospace;
        }
        .hud-title { font-weight: bold; font-size: 12px; text-transform: uppercase; margin-bottom: 4px; color: #fff; }
        .val { color: #fff; font-weight: bold; }

        .controls-bar { 
            position: absolute; bottom: 20px; left: 0; right: 0; 
            display: flex; justify-content: center; gap: 10px; z-index: 5; padding: 0 15px; 
        }

        /* BUTTONS */
        .btn-primary { 
            width: 100%; max-width: 340px; background: #06b6d4; color: #0b0f19; 
            border: none; padding: 18px; font-weight: 700; font-size: 14px; 
            border-radius: 30px; cursor: pointer; text-transform: uppercase; 
            letter-spacing: 0.5px; margin: 0 auto; box-shadow: 0 4px 15px rgba(6, 182, 212, 0.3);
        }

        .btn-secondary { 
            background: rgba(15, 23, 42, 0.85); color: #06b6d4; border: 1px solid #06b6d4; 
            padding: 10px 18px; font-weight: 600; font-size: 12px; border-radius: 20px; 
            cursor: pointer; text-transform: uppercase;
        }
    </style>
</head>
<body>

    <!-- FASE 1: CALIBRAZIONE TAP NORD -->
    <div id="calib-screen" class="calib-container" onclick="calibrateAndStartAR()">
        <div class="calib-header">
            <h1>CALIBRAZIONE IMPOSTATA</h1>
            <p>1. Orienta la parte superiore del telefono verso il <b>NORD REALE</b>.<br>2. Tocca in qualsiasi punto dello schermo per calibrare.</p>
        </div>

        <div class="calib-body">
            <div class="fixed-arrow-box">
                <div class="fixed-needle"></div>
            </div>
            <div class="tap-hint">▲ TAP SULLO SCHERMO PER COMPLETARE ▲</div>
        </div>

        <button class="btn-primary" onclick="event.stopPropagation(); calibrateAndStartAR();">TOCCA PER IMPORRE NORD E AVVIARE</button>
    </div>

    <!-- FASE 2: FOTOCAMERA E CANVAS AR (INIZIALMENTE NASCOSTI) -->
    <video id="camera-feed" autoplay playsinline muted class="hidden"></video>
    <canvas id="ar-canvas" class="hidden"></canvas>

    <!-- Telemetria AR -->
    <div id="hud-telemetry" class="hud-overlay hidden">
        <div class="hud-title">HUD STEP 1 - VISTA AR</div>
        <div>Heading: <span id="v-head" class="val">0</span>° | Offset Nord: <span id="v-offset" class="val">0</span>°</div>
        <div>Pitch  : <span id="v-pitch" class="val">0</span>° | Roll       : <span id="v-roll" class="val">0</span>°</div>
    </div>

    <!-- Controlli AR -->
    <div id="ar-controls" class="controls-bar hidden">
        <button class="btn-secondary" onclick="reopenCalibration()">Ricalibra Nord</button>
    </div>

    <script>
        const RAD = Math.PI / 180;
        const DEG = 180 / Math.PI;

        let rawAlpha = 0, rawBeta = 0, rawGamma = 0;
        let sHeading = 0, sPitch = 0, sRoll = 0;
        let currentHeading = 0;
        let calibratedOffset = 0;
        let isARActive = false;

        window.addEventListener('DOMContentLoaded', () => {
            initSensors();
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
            requestAnimationFrame(renderLoop);
        });

        // CALIBRAZIONE AL TAP: IMPOSTA L'ORIENTAMENTO ATTUALE COME NORD (0°)
        async function calibrateAndStartAR() {
            // L'angolo attualmente misurato dalla bussola diventa l'offset di calibrazione (Nord)
            calibratedOffset = currentHeading;

            // Mostra fotocamera e livello AR
            document.getElementById('calib-screen').classList.add('hidden');
            document.getElementById('camera-feed').classList.remove('hidden');
            document.getElementById('ar-canvas').classList.remove('hidden');
            document.getElementById('hud-telemetry').classList.remove('hidden');
            document.getElementById('ar-controls').classList.remove('hidden');

            isARActive = true;
            await startCamera();
        }

        function reopenCalibration() {
            isARActive = false;
            document.getElementById('calib-screen').classList.remove('hidden');
            document.getElementById('camera-feed').classList.add('hidden');
            document.getElementById('ar-canvas').classList.add('hidden');
            document.getElementById('hud-telemetry').classList.add('hidden');
            document.getElementById('ar-controls').classList.add('hidden');
        }

        async function startCamera() {
            const video = document.getElementById('camera-feed');
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false });
                video.srcObject = stream;
            } catch (err) {
                try {
                    const streamFallback = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                    video.srcObject = streamFallback;
                } catch (e) {
                    alert("Impossibile accedere alla fotocamera. Verifica i permessi nel browser.");
                }
            }
        }

        function resizeCanvas() {
            const canvas = document.getElementById('ar-canvas');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        function initSensors() {
            window.addEventListener('deviceorientation', (e) => {
                if (e.alpha === null) return;
                rawAlpha = e.alpha;
                rawBeta = e.beta || 0;
                rawGamma = e.gamma || 0;
            });
        }

        // MOTORE VETTORIALE GRAVITAZIONALE
        function getGravityAttitude(alpha, beta, gamma) {
            const a = alpha * RAD;
            const b = beta * RAD;
            const g = gamma * RAD;

            const cA = Math.cos(a), sA = Math.sin(a);
            const cB = Math.cos(b), sB = Math.sin(b);
            const cG = Math.cos(g), sG = Math.sin(g);

            const Gx = sG * cB;
            const Gy = -sB;
            const Gz = -cG * cB;

            const camUp = -Gz; 
            const pitch = Math.asin(Math.max(-1, Math.min(1, camUp))) * DEG;

            const isLandscape = window.innerWidth > window.innerHeight;
            let roll = 0;

            if (!isLandscape) {
                roll = Math.atan2(Gx, -Gy) * DEG;
            } else {
                const scrAngle = (screen.orientation && screen.orientation.angle !== undefined) 
                    ? screen.orientation.angle : (window.orientation || 0);
                if (scrAngle === 90) {
                    roll = Math.atan2(-Gy, Gx) * DEG;
                } else {
                    roll = Math.atan2(Gy, -Gx) * DEG;
                }
            }

            const camE = -(cA * sG + sA * sB * cG);
            const camN = -(sA * sG - cA * sB * cG);
            let heading = Math.atan2(camE, camN) * DEG;
            if (heading < 0) heading += 360;

            return { heading, pitch, roll };
        }

        // CICLO RENDERING
        function renderLoop() {
            const attitude = getGravityAttitude(rawAlpha, rawBeta, rawGamma);
            currentHeading = attitude.heading;

            if (isARActive) {
                renderARHUD(attitude);
            }

            requestAnimationFrame(renderLoop);
        }

        function renderARHUD(attitude) {
            const canvas = document.getElementById('ar-canvas');
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const w = canvas.width;
            const h = canvas.height;
            const cx = w / 2;
            const cy = h / 2;
            const isLandscape = w > h;

            // Smorzamento LERP
            let diffH = currentHeading - sHeading;
            if (diffH > 180) diffH -= 360;
            if (diffH < -180) diffH += 360;
            sHeading = (sHeading + diffH * 0.12 + 360) % 360;

            sPitch += (attitude.pitch - sPitch) * 0.12;
            
            let diffR = attitude.roll - sRoll;
            if (diffR > 180) diffR -= 360;
            if (diffR < -180) diffR += 360;
            sRoll = sRoll + diffR * 0.12;

            // Telemetria
            document.getElementById('v-head').innerText = sHeading.toFixed(1);
            document.getElementById('v-pitch').innerText = sPitch.toFixed(1);
            document.getElementById('v-roll').innerText = sRoll.toFixed(1);
            document.getElementById('v-offset').innerText = calibratedOffset.toFixed(1);

            const fovV = isLandscape ? 45 : 65; 
            const fovH = isLandscape ? 70 : 50;
            
            const pxPerDegreeV = h / fovV;
            const pxPerDegreeH = w / fovH;
            
            const horizonY = -sPitch * pxPerDegreeV;

            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(-sRoll * RAD);

            // --- ORIZZONTE ARTIFICIALE ---
            ctx.strokeStyle = "#06b6d4";
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.moveTo(-w, horizonY);
            ctx.lineTo(w, horizonY);
            ctx.stroke();

            // Tacche di Inclinazione
            ctx.strokeStyle = "rgba(6, 182, 212, 0.5)";
            ctx.fillStyle = "#06b6d4";
            ctx.font = "11px monospace";
            for (let d = -40; d <= 40; d += 10) {
                if (d === 0) continue;
                let y = horizonY - (d * pxPerDegreeV);
                let wLine = d % 20 === 0 ? 50 : 25;
                ctx.beginPath();
                ctx.moveTo(-wLine, y); ctx.lineTo(wLine, y);
                ctx.stroke();
                ctx.fillText(d + "°", wLine + 5, y + 4);
            }

            // --- ASSI VERTICALI PUNTI CARDINALI (CORRETTI CON OFFSET TAP) ---
            const finalHeading = (sHeading - calibratedOffset + 360) % 360;
            const cardinals = [
                { name: "N (0°)",   deg: 0 },
                { name: "E (90°)",  deg: 90 },
                { name: "S (180°)", deg: 180 },
                { name: "W (270°)", deg: 270 }
            ];

            cardinals.forEach(pt => {
                let diff = pt.deg - finalHeading;
                if (diff > 180) diff -= 360;
                if (diff < -180) diff += 360;

                if (Math.abs(diff) <= fovH / 2) {
                    let posX = diff * pxPerDegreeH;

                    ctx.strokeStyle = "rgba(255, 255, 255, 0.5)";
                    ctx.lineWidth = 1.5;
                    ctx.setLineDash([6, 4]);
                    ctx.beginPath();
                    ctx.moveTo(posX, horizonY - h);
                    ctx.lineTo(posX, horizonY + h);
                    ctx.stroke();
                    ctx.setLineDash([]);

                    ctx.fillStyle = "#0f172a";
                    ctx.fillRect(posX - 35, horizonY - 14, 70, 28);
                    ctx.strokeStyle = "#06b6d4";
                    ctx.lineWidth = 1.5;
                    ctx.strokeRect(posX - 35, horizonY - 14, 70, 28);

                    ctx.fillStyle = "#ffffff";
                    ctx.font = "bold 12px monospace";
                    ctx.textAlign = "center";
                    ctx.textBaseline = "middle";
                    ctx.fillText(pt.name, posX, horizonY);
                }
            });

            ctx.restore();

            // MIRINO CENTRALE FISSO
            ctx.strokeStyle = "#ef4444";
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(cx, cy, 12, 0, Math.PI * 2);
            ctx.moveTo(cx - 20, cy); ctx.lineTo(cx + 20, cy);
            ctx.moveTo(cx, cy - 20); ctx.lineTo(cx, cy + 20);
            ctx.stroke();
        }
    </script>
</body>
</html>
