<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>HUD Fotocamera - Vettore Gravità Stabile</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: monospace, sans-serif; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000; color: #06b6d4; }
        
        #camera-feed { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
        #ar-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; }

        /* Telemetria */
        .hud-overlay { position: absolute; top: 15px; left: 15px; background: rgba(15, 23, 42, 0.85); border: 1px solid #06b6d4; padding: 12px; border-radius: 8px; font-size: 12px; z-index: 5; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .hud-title { font-weight: bold; font-size: 13px; text-transform: uppercase; margin-bottom: 6px; border-bottom: 1px solid #06b6d4; padding-bottom: 4px; color: #fff; }
        .val { color: #fff; font-weight: bold; }

        /* Controlli */
        .controls-bar { position: absolute; bottom: 20px; left: 0; right: 0; display: flex; justify-content: center; gap: 10px; z-index: 5; padding: 0 15px; }
        .btn { flex: 1; max-width: 160px; background: #06b6d4; color: #000; border: none; padding: 12px 10px; font-weight: bold; font-size: 13px; border-radius: 8px; cursor: pointer; text-transform: uppercase; }
        .btn:active { opacity: 0.8; }
    </style>
</head>
<body>

    <video id="camera-feed" autoplay playsinline muted></video>
    <canvas id="ar-canvas"></canvas>

    <div class="hud-overlay">
        <div class="hud-title">MOTORE GRAVITAZIONALE PRO</div>
        <div>Heading (Bussola) : <span id="v-head" class="val">0</span>°</div>
        <div>Pitch (Orizzonte): <span id="v-pitch" class="val">0</span>°</div>
        <div>Roll (Inclinazione): <span id="v-roll" class="val">0</span>°</div>
    </div>

    <div class="controls-bar">
        <button class="btn" onclick="calibratedOffset = currentHeading">Calibra Nord</button>
    </div>

    <script>
        const RAD = Math.PI / 180;
        const DEG = 180 / Math.PI;

        let rawAlpha = 0, rawBeta = 0, rawGamma = 0;
        let sHeading = 0, sPitch = 0, sRoll = 0;
        let currentHeading = 0;
        let calibratedOffset = 0;

        window.addEventListener('DOMContentLoaded', () => {
            initCamera();
            initSensors();
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
            requestAnimationFrame(renderHUD);
        });

        async function initCamera() {
            const video = document.getElementById('camera-feed');
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false });
                video.srcObject = stream;
            } catch (err) {
                try {
                    const streamFallback = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                    video.srcObject = streamFallback;
                } catch (e) {
                    console.warn("Fotocamera non disponibile.");
                }
            }
        }

        function resizeCanvas() {
            const canvas = document.getElementById('ar-canvas');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        function initSensors() {
            window.addEventListener('deviceorientation', (e) => {
                if (e.alpha === null) return;
                rawAlpha = e.alpha;
                rawBeta = e.beta || 0;
                rawGamma = e.gamma || 0;
            });
        }

        // CALCOLO BASATO SUL VETTORE GRAVITAZIONALE CONTINUO (SENZA GIMBAL LOCK)
        function getGravityAttitude(alpha, beta, gamma) {
            const a = alpha * RAD;
            const b = beta * RAD;
            const g = gamma * RAD;

            const cA = Math.cos(a), sA = Math.sin(a);
            const cB = Math.cos(b), sB = Math.sin(b);
            const cG = Math.cos(g), sG = Math.sin(g);

            // Componenti del Vettore Gravità (G) proiettate sullo schermo del dispositivo
            const Gx = sG * cB;      // Spinta laterale (sinistra/destra)
            const Gy = -sB;          // Spinta verticale (alto/basso)
            const Gz = -cG * cB;     // Spinta perpendicolare allo schermo

            // 1. PITCH (Elevazione della fotocamera rispetto all'orizzonte)
            // Quando la fotocamera punta l'orizzonte (telefono verticale), Gz = 0 -> pitch = 0°
            const camUp = -Gz; 
            const pitch = Math.asin(Math.max(-1, Math.min(1, camUp))) * DEG;

            // 2. ROLL (Inclinazione laterale dello schermo rispetto alla gravità)
            // Uso atan2(Gx, -Gy) che rimane totalmente stabile a 90°
            const isLandscape = window.innerWidth > window.innerHeight;
            let roll = 0;

            if (!isLandscape) {
                roll = Math.atan2(Gx, -Gy) * DEG;
            } else {
                const scrAngle = (screen.orientation && screen.orientation.angle !== undefined) 
                    ? screen.orientation.angle : (window.orientation || 0);
                if (scrAngle === 90) {
                    roll = Math.atan2(-Gy, Gx) * DEG;
                } else {
                    roll = Math.atan2(Gy, -Gx) * DEG;
                }
            }

            // 3. HEADING (Bussola orizzontale 3D)
            const camE = -(cA * sG + sA * sB * cG);
            const camN = -(sA * sG - cA * sB * cG);
            let heading = Math.atan2(camE, camN) * DEG;
            if (heading < 0) heading += 360;

            return { heading, pitch, roll };
        }

        function renderHUD() {
            const canvas = document.getElementById('ar-canvas');
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const w = canvas.width;
            const h = canvas.height;
            const cx = w / 2;
            const cy = h / 2;
            const isLandscape = w > h;

            // Calcolo atteggiamento spaziale
            const attitude = getGravityAttitude(rawAlpha, rawBeta, rawGamma);
            currentHeading = attitude.heading;

            // Smorzamento LERP (0.12) per fluidità visiva
            let diffH = currentHeading - sHeading;
            if (diffH > 180) diffH -= 360;
            if (diffH < -180) diffH += 360;
            sHeading = (sHeading + diffH * 0.12 + 360) % 360;

            sPitch += (attitude.pitch - sPitch) * 0.12;
            
            // Smorzamento continuo del rollio (evita salti attorno a ±180)
            let diffR = attitude.roll - sRoll;
            if (diffR > 180) diffR -= 360;
            if (diffR < -180) diffR += 360;
            sRoll = sRoll + diffR * 0.12;

            // Telemetria
            document.getElementById('v-head').innerText = sHeading.toFixed(1);
            document.getElementById('v-pitch').innerText = sPitch.toFixed(1);
            document.getElementById('v-roll').innerText = sRoll.toFixed(1);

            // --- 1. ORIZZONTE ARTIFICIALE ---
            const fovV = isLandscape ? 45 : 65; 
            const pxPerDegree = h / fovV;
            
            // Quando pitch = 0 (telefono verticale di fronte all'orizzonte), horizonY = 0 (centro esatto dello schermo)
            const horizonY = sPitch * pxPerDegree;

            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(-sRoll * RAD); // Ruota in opposizione al rollio per mantenere l'orizzonte vero

            // Linea dell'Orizzonte
            ctx.strokeStyle = "#06b6d4";
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(-w, horizonY);
            ctx.lineTo(w, horizonY);
            ctx.stroke();

            // Tacche d'inclinazione (+/- 10, 20, 30 gradi)
            ctx.strokeStyle = "rgba(6, 182, 212, 0.5)";
            ctx.fillStyle = "#06b6d4";
            ctx.font = "11px monospace";
            for (let d = -40; d <= 40; d += 10) {
                if (d === 0) continue;
                let y = horizonY - (d * pxPerDegree);
                let wLine = d % 20 === 0 ? 50 : 25;
                ctx.beginPath();
                ctx.moveTo(-wLine, y); ctx.lineTo(wLine, y);
                ctx.stroke();
                ctx.fillText(d + "°", wLine + 5, y + 4);
            }
            ctx.restore();

            // Mirino centrale fisso dello schermo (Rosso)
            ctx.strokeStyle = "#ef4444";
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(cx, cy, 12, 0, Math.PI * 2);
            ctx.moveTo(cx - 20, cy); ctx.lineTo(cx + 20, cy);
            ctx.moveTo(cx, cy - 20); ctx.lineTo(cx, cy + 20);
            ctx.stroke();

            // --- 2. ASSI VERTICALI DEI PUNTI CARDINALI ---
            const finalHeading = (sHeading - calibratedOffset + 360) % 360;
            const fovH = isLandscape ? 70 : 50;

            const cardinals = [
                { name: "N", deg: 0 },
                { name: "E", deg: 90 },
                { name: "S", deg: 180 },
                { name: "W", deg: 270 }
            ];

            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 18px monospace";
            ctx.textAlign = "center";
            ctx.strokeStyle = "rgba(255, 255, 255, 0.4)";
            ctx.lineWidth = 2;

            cardinals.forEach(pt => {
                let diff = pt.deg - finalHeading;
                if (diff > 180) diff -= 360;
                if (diff < -180) diff += 360;

                if (Math.abs(diff) <= fovH / 2) {
                    let posX = cx + (diff * (w / fovH));
                    
                    ctx.beginPath();
                    ctx.moveTo(posX, 100);
                    ctx.lineTo(posX, h - 80);
                    ctx.stroke();

                    ctx.fillText(pt.name, posX, h - 60);
                }
            });

            requestAnimationFrame(renderHUD);
        }
    </script>
</body>
</html>
