<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>PeakFinder AR - MVP v3</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000; color: #fff; }
        
        #camera-feed { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
        #ar-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; }

        .screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; z-index: 10; background: rgba(0,0,0,0.85); }
        .hidden { display: none !important; }

        .calibration-box { background: rgba(20,20,20,0.95); padding: 20px; border-radius: 16px; text-align: center; margin: auto 0; border: 1px solid #333; }
        .compass-dial { width: 160px; height: 160px; border: 4px solid #00E676; border-radius: 50%; margin: 15px auto; position: relative; display: flex; align-items: center; justify-content: center; }
        .arrow { width: 6px; height: 70px; background: #00E676; position: absolute; transform-origin: bottom center; top: 10px; border-radius: 4px; }
        .arrow::before { content: ''; position: absolute; top: -10px; left: -7px; border-left: 10px solid transparent; border-right: 10px solid transparent; border-bottom: 15px solid #00E676; }

        .btn { min-height: 48px; min-width: 48px; background: #00E676; color: #000; border: none; padding: 12px 24px; font-weight: bold; font-size: 16px; border-radius: 24px; cursor: pointer; margin: 5px; }
        .btn:active { opacity: 0.8; }
        .btn-secondary { background: #333; color: #fff; }
        input[type=range] { width: 100%; height: 48px; }

        .status-bar { position: absolute; top: 15px; left: 15px; right: 15px; background: rgba(0,0,0,0.75); padding: 10px; border-radius: 8px; font-size: 12px; z-index: 5; pointer-events: none; border: 1px solid #444; }
        .controls-bar { position: absolute; bottom: 20px; left: 0; right: 0; display: flex; justify-content: center; z-index: 5; gap: 10px; }
    </style>
</head>
<body>

    <video id="camera-feed" autoplay playsinline></video>
    <canvas id="ar-canvas"></canvas>

    <div id="status-bar" class="status-bar hidden">
        GPS: <span id="gps-status">In attesa...</span> | Altitudine: <span id="user-alt">--</span>m | Cime mostrate: <span id="peaks-count">0</span>
    </div>

    <!-- Calibrazione Nord -->
    <div id="calib-screen" class="screen">
        <div style="text-align: center; margin-top: 10px;">
            <h2>Calibrazione Nord</h2>
            <p style="font-size: 13px; color: #ccc; margin-top: 5px;">Orienta la freccia verso il Nord. Funziona sia in verticale che in orizzontale.</p>
        </div>

        <div class="calibration-box">
            <div class="compass-dial">
                <div id="arrow" class="arrow" style="transform: rotate(0deg);"></div>
            </div>
            <div style="margin: 10px 0;">
                <input type="range" id="angle-slider" min="0" max="359" value="0">
            </div>
            <p>Offset Nord: <b id="angle-val">0°</b></p>
            <p style="font-size: 11px; color: #aaa; margin-top: 4px;">Orientamento schermo: <span id="orient-val">Portrait</span></p>
        </div>

        <button class="btn" onclick="confirmCalibration()">Conferma e Avvia Fotocamera</button>
    </div>

    <div id="ar-controls" class="controls-bar hidden">
        <button class="btn btn-secondary" onclick="recalibrate()">Ricalibra Nord</button>
        <button class="btn" id="freeze-btn" onclick="toggleFreeze()">Blocca Vista</button>
    </div>

    <script>
        let userLat = null, userLon = null, userAlt = 0;
        let calibratedNorthOffset = 0;
        let deviceAlpha = 0, deviceBeta = 0, deviceGamma = 0;
        let visiblePeaks = [];
        let isFrozen = false;
        let videoStream = null;

        const slider = document.getElementById('angle-slider');
        const arrow = document.getElementById('arrow');
        const angleVal = document.getElementById('angle-val');

        slider.addEventListener('input', (e) => {
            const val = e.target.value;
            arrow.style.transform = `rotate(${val}deg)`;
            angleVal.innerText = `${val}°`;
        });

        window.addEventListener('DOMContentLoaded', () => {
            initGPS();
            initSensors();
            window.addEventListener('resize', resizeCanvas);
        });

        function getScreenAngle() {
            return (screen.orientation && screen.orientation.angle) !== undefined 
                ? screen.orientation.angle 
                : (window.orientation || 0);
        }

        function initGPS() {
            if ("geolocation" in navigator) {
                navigator.geolocation.watchPosition(
                    pos => {
                        userLat = pos.coords.latitude;
                        userLon = pos.coords.longitude;
                        userAlt = pos.coords.altitude || 0;
                        document.getElementById('gps-status').innerText = `${userLat.toFixed(3)}, ${userLon.toFixed(3)}`;
                        document.getElementById('user-alt').innerText = Math.round(userAlt);
                        if (visiblePeaks.length === 0) fetchPeaks(userLat, userLon);
                    },
                    err => { document.getElementById('gps-status').innerText = "Errore GPS"; },
                    { enableHighAccuracy: true }
                );
            }
        }

        function initSensors() {
            window.addEventListener('deviceorientation', (e) => {
                if (isFrozen) return;
                deviceAlpha = e.alpha || 0;
                deviceBeta = e.beta || 0;
                deviceGamma = e.gamma || 0;

                const screenAngle = getScreenAngle();
                document.getElementById('orient-val').innerText = (screenAngle === 90 || screenAngle === 270) ? "Landscape" : "Portrait";

                if (!document.getElementById('calib-screen').classList.contains('hidden')) return;
                renderAR();
            });
        }

        // Calcolo Azimuth Compensato per Portrait e Landscape
        function getTiltCompensatedAzimuth() {
            let alpha = deviceAlpha * Math.PI / 180;
            let beta = deviceBeta * Math.PI / 180;
            let gamma = deviceGamma * Math.PI / 180;
            const screenAngle = getScreenAngle();

            // Adattamento coordinate vettoriali in base all'orientamento dello schermo
            if (screenAngle === 90) {
                let temp = beta;
                beta = -gamma;
                gamma = temp;
            } else if (screenAngle === 270) {
                let temp = beta;
                beta = gamma;
                gamma = -temp;
            }

            const vx = Math.sin(alpha) * Math.cos(gamma) + Math.cos(alpha) * Math.sin(beta) * Math.sin(gamma);
            const vy = Math.cos(alpha) * Math.cos(gamma) - Math.sin(alpha) * Math.sin(beta) * Math.sin(gamma);

            let azimuth = Math.atan2(vx, vy) * 180 / Math.PI;
            return (azimuth + 360) % 360;
        }

        function confirmCalibration() {
            const manualAngle = parseInt(slider.value);
            const currentAzimuth = getTiltCompensatedAzimuth();
            calibratedNorthOffset = (currentAzimuth - manualAngle + 360) % 360;

            document.getElementById('calib-screen').classList.add('hidden');
            document.getElementById('status-bar').classList.remove('hidden');
            document.getElementById('ar-controls').classList.remove('hidden');

            startCamera();
        }

        function recalibrate() {
            document.getElementById('calib-screen').classList.remove('hidden');
            document.getElementById('status-bar').classList.add('hidden');
            document.getElementById('ar-controls').classList.add('hidden');
        }

        async function startCamera() {
            try {
                videoStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { exact: "environment" } }, audio: false
                });
                document.getElementById('camera-feed').srcObject = videoStream;
            } catch (err) {
                videoStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                document.getElementById('camera-feed').srcObject = videoStream;
            }
            resizeCanvas();
        }

        function resizeCanvas() {
            const canvas = document.getElementById('ar-canvas');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        // Recupero, Filtraggio Drastico e Assegnazione Slot Fissi
        async function fetchPeaks(lat, lon) {
            const radius = 30000; // 30 km
            const query = `[out:json];node["natural"="peak"](around:${radius},${lat},${lon});out;`;
            const url = `https://overpass-api.de/api/interpreter?data=${encodeURIComponent(query)}`;

            try {
                const res = await fetch(url);
                const data = await res.json();
                
                let raw = data.elements.map(el => {
                    const name = el.tags.name || el.tags['name:it'] || el.tags.official_name;
                    if (!name || !el.tags.ele) return null;

                    const ele = parseFloat(el.tags.ele);
                    const distKm = calculateDistance(lat, lon, el.lat, el.lon);
                    const bearing = calculateBearing(lat, lon, el.lat, el.lon);
                    
                    // Score di rilevanza: altitudine / radice della distanza
                    const prominenceScore = ele / Math.sqrt(distKm);

                    return {
                        name, ele, dist: distKm, bearing,
                        prominenceScore,
                        smoothX: null, smoothY: null
                    };
                }).filter(p => p !== null);

                // 1. Ordina per rilevanza e prendi solo le migliori 12 cime in assoluto
                raw.sort((a, b) => b.prominenceScore - a.prominenceScore);
                let topPeaks = raw.slice(0, 12);

                // 2. Assegna a ogni cima uno slot verticale fisso (0, 1, 2) per evitare salti
                topPeaks.sort((a, b) => a.dist - b.dist);
                topPeaks.forEach((p, idx) => {
                    p.slot = idx % 3; // 3 livelli verticali prestabiliti
                });

                visiblePeaks = topPeaks;
                document.getElementById('peaks-count').innerText = visiblePeaks.length;
            } catch (e) {
                console.error("Errore recupero cime:", e);
            }
        }

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        function calculateBearing(lat1, lon1, lat2, lon2) {
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const y = Math.sin(dLon) * Math.cos(lat2 * Math.PI / 180);
            const x = Math.cos(lat1 * Math.PI / 180) * Math.sin(lat2 * Math.PI / 180) -
                      Math.sin(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.cos(dLon);
            return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
        }

        // Rendering con Smoothing (LERP) e FOV dinamico
        function renderAR() {
            const canvas = document.getElementById('ar-canvas');
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const isLandscape = window.innerWidth > window.innerHeight;
            const fovH = isLandscape ? 75 : 50; // Campo visivo orizzontale in gradi
            const fovV = isLandscape ? 45 : 65;

            const currentHeading = (getTiltCompensatedAzimuth() - calibratedNorthOffset + 360) % 360;

            visiblePeaks.forEach(peak => {
                let diffBearing = peak.bearing - currentHeading;
                if (diffBearing > 180) diffBearing -= 360;
                if (diffBearing < -180) diffBearing += 360;

                if (Math.abs(diffBearing) < fovH / 2) {
                    // Posizione target teorica
                    let targetX = (canvas.width / 2) + (diffBearing * (canvas.width / fovH));
                    
                    // Y fissa basata sullo slot di appartenenza (no jittering da collisione dinamica)
                    let baseCenterY = canvas.height / 2;
                    let slotOffsetY = (peak.slot - 1) * 38; // Distanziamento verticale precalcolato
                    let targetY = baseCenterY + slotOffsetY;

                    // Smoothing LERP per movimento fluido
                    if (peak.smoothX === null) {
                        peak.smoothX = targetX;
                        peak.smoothY = targetY;
                    } else {
                        peak.smoothX += (targetX - peak.smoothX) * 0.2; // Fattore di ammortizzamento
                        peak.smoothY += (targetY - peak.smoothY) * 0.2;
                    }

                    // Disegno etichetta su coordinate smorzate (smoothX, smoothY)
                    ctx.save();
                    ctx.translate(peak.smoothX, peak.smoothY);

                    // Pallino cima
                    ctx.fillStyle = "#00E676";
                    ctx.beginPath();
                    ctx.arc(0, 0, 5, 0, Math.PI * 2);
                    ctx.fill();

                    // Box Info
                    ctx.fillStyle = "rgba(0,0,0,0.85)";
                    ctx.strokeStyle = "#00E676";
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.roundRect(-60, -38, 120, 32, 6);
                    ctx.fill();
                    ctx.stroke();

                    // Testo
                    ctx.fillStyle = "#FFF";
                    ctx.font = "bold 11px system-ui";
                    ctx.textAlign = "center";
                    ctx.fillText(peak.name, 0, -22);
                    ctx.fillStyle = "#00E676";
                    ctx.font = "10px system-ui";
                    ctx.fillText(`${peak.ele}m | ${peak.dist.toFixed(1)}km`, 0, -10);

                    ctx.restore();
                } else {
                    // Reset coordinate se la cima esce dallo schermo
                    peak.smoothX = null;
                    peak.smoothY = null;
                }
            });
        }

        function toggleFreeze() {
            isFrozen = !isFrozen;
            const video = document.getElementById('camera-feed');
            const btn = document.getElementById('freeze-btn');
            if (isFrozen) {
                video.pause();
                btn.innerText = "Sblocca Vista";
            } else {
                video.play();
                btn.innerText = "Blocca Vista";
            }
        }
    </script>
</body>
</html>
